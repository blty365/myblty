<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现代图文展示页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f9fafb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .card {
            max-width: 800px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .card-content {
            padding: 2.5rem;
        }

        .card-title {
            font-size: 1.8rem;
            color: #1f2937;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .card-desc {
            color: #4b5563;
            line-height: 1.6;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            .card-img {
                height: 280px;
            }
            .card-content {
                padding: 1.8rem;
            }
            .card-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 替换 src 为你的图片链接 -->
        < img src="https://picsum.photos/800/400" alt="风景展示图" class="card-img">
        <div class="card-content">
            <h2 class="card-title">自然风景精选</h2>
            <p class="card-desc">这是一处藏于山野间的静谧风景，澄澈的天空与连绵的绿意相映成趣。在这里可以远离城市的喧嚣，感受微风拂过的轻柔，聆听鸟鸣虫吟的自然乐章，是放松身心、重拾内心平静的绝佳去处。</p >
        </div>
    </div>
</body>
</html>
