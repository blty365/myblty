<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日论语 | 国学经典</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: '楷体', 'KaiTi', serif;
            color: #333;
            line-height: 1.6;
            background: linear-gradient(135deg, #f6e8e3 0%, #e0d4c9 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            z-index: -1;
        }
        
        .container {
            max-width: 800px;
            width: 90%;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin: 20px;
            text-align: center;
        }
        
        h1 {
            color: #4a2c3f;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        .date {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 30px;
        }
        
        .content {
            background: #f9f7f2;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1.2em;
            border-left: 4px solid #4a2c3f;
        }
        
        .quote {
            font-style: italic;
            color: #555;
            margin-bottom: 15px;
        }
        
        .explanation {
            color: #333;
        }
        
        .verse {
            font-weight: bold;
            color: #4a2c3f;
        }
        
        .footer {
            color: #888;
            font-size: 0.8em;
            margin-top: 30px;
        }
        
        .btn {
            background-color: #4a2c3f;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background-color: #3a1c2f;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            .content {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>每日论语</h1>
        <div class="date" id="dateDisplay">2026年01月02日</div>
        
        <div class="content" id="content">
            <!-- 内容将通过JavaScript动态生成 -->
        </div>
        
        <a href="#" class="btn" id="refreshBtn">获取今日论语</a>
        
        <div class="footer">
            <p>每天一句论语，感悟儒家智慧。</p>
            <p id="nextDay">明日更新：...</p>
        </div>
    </div>

    <script>
        // 论语数据（可以继续扩展）
        const lunyuData = [
            {
                verse: "子曰：'学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？'",
                explanation: "孔子说：'学了又时常温习和练习，不是很愉快吗？有志同道合的人从远方来，不是很令人高兴的吗？人家不了解我，我也不怨恨、恼怒，不也是一个有德的君子吗？'"
            },
            {
                verse: "有子曰：'其为人也孝弟，而好犯上者，鲜矣；不好犯上，而好作乱者，未之有也。君子务本，本立而道生。孝弟也者，其为仁之本与！'",
                explanation: "有子说：'孝顺父母，顺从兄长，而喜好触犯上层统治者，这样的人是很少见的。不喜好触犯上层统治者，而喜好造反的人是没有的。君子专心致力于根本的事务，根本建立了，治国做人的原则也就有了。孝顺父母、顺从兄长，这就是仁的根本啊！'"
            },
            {
                verse: "子曰：'巧言令色，鲜矣仁！'",
                explanation: "孔子说：'花言巧语，装出好看的脸色，摆出逢迎的姿式，这种人仁德是很少的！'"
            },
            {
                verse: "曾子曰：'吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？'",
                explanation: "曾子说：'我每天多次反省自己：为别人办事是不是尽心竭力了呢？同朋友交往是不是做到诚实可信了呢？老师传授给我的学业是不是复习了呢？'"
            },
            {
                verse: "子曰：'道千乘之国，敬事而信，节用而爱人，使民以时。'",
                explanation: "孔子说：'治理一个拥有一千辆兵车的国家，就要严谨认真地办理国家大事而又恪守信用，诚实无欺，节约财政开支而又爱护官吏臣僚，役使百姓要不误农时。'"
            },
            {
                verse: "子曰：'弟子入则孝，出则弟，谨而信，泛爱众，而亲仁。行有余力，则以学文。'",
                explanation: "孔子说：'弟子们在父母跟前，就孝顺父母；出门在外，要顺从师长，言行要谨慎，要诚实可信，寡言少语，要广泛地去爱众人，亲近那些有仁德的人。这样躬行实践之后，还有余力的话，就再去学习文献知识。'"
            }
        ];

        // 获取当前日期
        function getDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}年${month}月${day}日`;
        }

        // 随机获取论语条目
        function getRandomLunyu() {
            const index = Math.floor(Math.random() * lunyuData.length);
            return lunyuData[index];
        }

        // 获取明日论语（模拟）
        function getNextDayLunyu() {
            const nextIndex = Math.floor(Math.random() * lunyuData.length);
            return lunyuData[nextIndex].verse;
        }

        // 更新页面内容
        function updateContent() {
            const dateElement = document.getElementById('dateDisplay');
            const contentElement = document.getElementById('content');
            const nextDayElement = document.getElementById('nextDay');
            
            // 更新日期
            dateElement.textContent = getDateString();
            
            // 获取随机论语
            const lunyu = getRandomLunyu();
            
            // 创建内容HTML
            const contentHtml = `
                <div class="quote">
                    <p class="verse">${lunyu.verse}</p>
                    <p class="explanation">${lunyu.explanation}</p>
                </div>
            `;
            
            contentElement.innerHTML = contentHtml;
            
            // 设置明日更新
            nextDayElement.textContent = `明日更新：${getNextDayLunyu()}`;
        }

        // 页面加载时更新内容
        window.onload = updateContent;

        // 点击按钮更新内容
        document.getElementById('refreshBtn').addEventListener('click', function(e) {
            e.preventDefault();
            updateContent();
        });
    </script>
</body>
</html>
